<div class="panel">
  <div class="row modes" role="group" aria-label="Generator type">
    <button
      type="button"
      class="btn small mode"
      [class.selected]="mode === 'password'"
      [attr.aria-pressed]="mode === 'password'"
      (click)="setMode('password')"
    >
      Password
    </button>
    <button
      type="button"
      class="btn small mode"
      [class.selected]="mode === 'passphrase'"
      [attr.aria-pressed]="mode === 'passphrase'"
      (click)="setMode('passphrase')"
    >
      Passphrase
    </button>
  </div>
  <div class="row out">
    <code class="generated">{{ current() || '…' }}</code>
    <button type="button" class="btn small" (click)="regenerate()" [disabled]="busy()">
      Regenerate
    </button>
  </div>
  <app-password-strength-meter [password]="current()" [entropyBits]="entropyBits()" />
  @if (entropyBits() !== null) {
    <p class="entropy">About {{ roundedEntropy() }} bits of entropy.</p>
  }
  @if (error()) {
    <p class="warn">{{ error() }}</p>
  }
  @if (mode === 'password') {
    <div class="row">
      <label class="length">
        Length: <strong>{{ opts.length }}</strong>
        <input
          type="range"
          min="4"
          max="64"
          [(ngModel)]="opts.length"
          name="length"
          (input)="regenerate()"
        />
      </label>
    </div>
    <div class="row classes">
      <label>
        <input type="checkbox" [(ngModel)]="opts.includeLowercase" name="lc" (change)="regenerate()" />
        a–z
      </label>
      <label>
        <input type="checkbox" [(ngModel)]="opts.includeUppercase" name="uc" (change)="regenerate()" />
        A–Z
      </label>
      <label>
        <input type="checkbox" [(ngModel)]="opts.includeNumbers" name="num" (change)="regenerate()" />
        0–9
      </label>
      <label>
        <input type="checkbox" [(ngModel)]="opts.includeSymbols" name="sym" (change)="regenerate()" />
        Symbols
      </label>
      <label>
        <input type="checkbox" [(ngModel)]="opts.excludeAmbiguous" name="amb" (change)="regenerate()" />
        Exclude ambiguous
      </label>
    </div>
  } @else {
    <div class="row">
      <label class="length">
        Words: <strong>{{ phraseOpts.wordCount }}</strong>
        <input
          type="range"
          [min]="minWords"
          [max]="maxWords"
          [(ngModel)]="phraseOpts.wordCount"
          name="wordCount"
          (input)="regenerate()"
        />
      </label>
    </div>
    <div class="row classes">
      <label class="separator">
        Separator
        <input
          type="text"
          maxlength="4"
          size="4"
          [(ngModel)]="phraseOpts.separator"
          name="separator"
          (input)="regenerate()"
        />
      </label>
      <label>
        <input
          type="checkbox"
          [(ngModel)]="phraseOpts.capitalize"
          name="capitalize"
          (change)="regenerate()"
        />
        Capitalize
      </label>
      <label>
        <input
          type="checkbox"
          [(ngModel)]="phraseOpts.includeNumber"
          name="includeNumber"
          (change)="regenerate()"
        />
        Include a number
      </label>
    </div>
  }
  <div class="row actions">
    <button type="button" class="btn small" (click)="copy()" [disabled]="!current()">
      Copy
    </button>
    <button type="button" class="btn small primary" (click)="use()" [disabled]="!current()">
      Use this {{ mode === 'passphrase' ? 'passphrase' : 'password' }}
    </button>
  </div>
</div>
