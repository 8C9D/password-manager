<div class="layout">
  <header class="topbar">
    <h1>{{ vault.status()?.vaultName || 'Password Manager' }}</h1>
    <input
      #searchBox
      type="search"
      aria-label="Search entries by title, username, or URL"
      placeholder="Search title / username / URL  (/)"
      class="search"
      [ngModel]="entries.searchQuery()"
      (ngModelChange)="entries.searchQuery.set($event)"
      name="search"
    />
    <div class="spacer"></div>
    <a routerLink="/vault/new" class="btn primary" title="New entry (Ctrl/Cmd+N)">+ Add entry</a>
    <a routerLink="/vault/health" class="btn" title="Vault health" aria-label="Vault health">
      <span aria-hidden="true">🛡</span>
    </a>
    <a routerLink="/vault/trash" class="btn" title="Trash" aria-label="Trash">
      <span aria-hidden="true">🗑</span>
    </a>
    <a routerLink="/vault/settings" class="btn" title="Settings" aria-label="Settings">
      <span aria-hidden="true">⚙</span>
    </a>
    <button class="btn" type="button" title="Lock vault (Ctrl/Cmd+L)" (click)="onLock()">
      Lock
    </button>
  </header>
  @if (lockError(); as msg) {
    <div class="lock-error-banner">Failed to lock the vault: {{ msg }}</div>
  }
  @if (clipboard.lastCopiedLabel(); as label) {
    <div class="clipboard-banner">
      Copied {{ label }} — auto-clears in {{ clipboard.remainingSecs() }}s.
    </div>
  }
  <div class="cols">
    <app-category-sidebar />
    <section class="list-pane">
      <app-entry-list />
    </section>
    <main class="detail-pane">
      <router-outlet />
    </main>
  </div>
</div>
