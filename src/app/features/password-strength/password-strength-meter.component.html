@if (password().length > 0) {
  <div class="meter" [attr.data-score]="strength().score">
    <div class="segments">
      @for (i of [1, 2, 3, 4]; track i) {
        <span class="segment" [class.filled]="strength().score >= i || i === 1"></span>
      }
    </div>
    <span class="label">{{ strength().label }}</span>
  </div>
}
