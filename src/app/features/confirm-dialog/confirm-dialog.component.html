@if (state().open) {
  <div class="backdrop" (click)="cancel()">
    <div
      #dialog
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
      (click)="$event.stopPropagation()"
    >
      <h3 id="confirm-title">{{ state().title }}</h3>
      <p id="confirm-message">{{ state().message }}</p>
      <div class="actions">
        <button type="button" class="btn" (click)="cancel()">
          {{ state().cancelLabel }}
        </button>
        <button
          #confirmBtn
          type="button"
          class="btn"
          [class.danger]="state().danger"
          [class.primary]="!state().danger"
          (click)="confirm()"
        >
          {{ state().confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
