name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 needs these system libraries to compile the backend crate,
      # even for `cargo test --lib` (the tauri/wry/tao deps link against them).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      # Pinned to the dev toolchain so `-D warnings` gates on our code, not on
      # lints a newer clippy might newly emit. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build

  # The npm advisory surface is almost entirely Angular/vite build tooling
  # (vite, esbuild, undici, tar, sigstore, ...) that runs only at dev/build
  # time and is NOT shipped inside the Tauri desktop binary (the app ships a
  # static bundle; there is no Node runtime or dev server in production).
  # Kept as an informational, non-blocking signal rather than a hard gate so
  # build-tooling churn does not wedge CI red. The Rust advisory audit below,
  # which covers code that DOES ship in the binary, is blocking.
  npm-audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (production deps)
        run: npm audit --omit=dev

  cargo-audit:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads the ignore list + rationale from .cargo/audit.toml. Fails on any
      # unignored vulnerability; unmaintained/unsound advisories stay as
      # non-failing warnings.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
